<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#55f5ff">
  <meta name="robots" content="noindex">
  <title>404 · Página não encontrada | Atisq</title>
  <base href="/">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/style.css?v=x-updates">
  <style>
    html { overflow-x: hidden; }
    body { overflow-x: clip; }

    .world {
      bottom: 0;
      height: auto;
    }

    .error-sign h1 {
      margin: 0 0 4px;
      font-size: clamp(1.05rem, 3.5vw, 1.375rem);
      font-weight: 400;
    }

    .error-stage {
      height: clamp(260px, 36vw, 420px);
      padding: 0 12px clamp(50px, 8vw, 108px);
    }

    .error-iris { right: 12%; }

    .error-art {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: .045em;
      color: #fff0cf;
      font: clamp(3.75rem, 15vw, 9rem)/.95 "Fredoka One", Verdana, sans-serif;
      text-shadow: 0 .033em #26321d, 0 .075em #151c14;
    }

    .portal {
      position: relative;
      display: grid;
      place-items: center;
      width: .59em;
      height: .86em;
      filter: drop-shadow(0 0 .11em #c6a5ff) drop-shadow(0 .055em #262037);
    }

    .portal::before, .portal::after {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      clip-path: polygon(28% 0, 72% 0, 72% 8%, 87% 8%, 87% 20%, 100% 20%, 100% 80%, 87% 80%, 87% 92%, 72% 92%, 72% 100%, 28% 100%, 28% 92%, 13% 92%, 13% 80%, 0 80%, 0 20%, 13% 20%, 13% 8%, 28% 8%);
      content: "";
    }

    .portal::before {
      background: linear-gradient(155deg, #fff0ff 8%, #c3aaff 39%, #7659bf 67%, #e0bdff 94%);
    }

    .portal::after {
      width: 77%;
      height: 82%;
      background: radial-gradient(ellipse at 52% 25%, #7854aa, #352850 62%, #211a34);
    }

    .spark {
      position: absolute;
      z-index: 1;
      width: .04em;
      height: .04em;
      background: #ead5ff;
      box-shadow: 0 0 .04em #bca5ff;
    }

    .spark:nth-child(1) { top: 25%; left: 38%; }
    .spark:nth-child(2) { top: 47%; right: 25%; }
    .spark:nth-child(3) { bottom: 27%; left: 30%; }

    .error-actions { padding: 24px 12px 28px; }

    @media (max-width: 600px) {
      .error-stage { height: 260px; }
      .error-stage .error-iris { display: block; right: 14px; }
      .error-stage .stage-house { width: 95px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .world-clouds, .stage-clouds, .world-butterflies, .stage-butterflies, .chicken-actor {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="world" aria-hidden="true">
    <div class="world-sky" id="world-sky">
      <div class="world-mountains"></div>
      <div class="world-clouds" id="world-clouds"></div>
      <div class="world-forest-back"></div>
      <div class="world-forest-mid"></div>
      <div class="world-butterflies" id="world-butterflies"></div>
    </div>
    <div class="world-horizon"></div>
    <div class="world-soil"></div>
  </div>

  <div class="portal-wrap">
    <!-- Left horizon scenery (outside main stone frame) -->
    <div class="flank flank-left" aria-hidden="true">
      <img class="flank-tree-far-left" src="assets/arvore-meio.png" alt="">
      <img class="flank-tree-left" src="assets/arvore-esquerda.png" alt="">
      <img class="flank-bush-large-left" src="assets/bush-large.png" alt="">
      <img class="flank-bush-left" src="assets/bush.png" alt="">
      <img class="flank-bush-flowers-left" src="assets/bush-flowers.png" alt="">
      <img class="flank-stump" src="assets/stump.png" alt="">
      <img class="flank-flowers" src="assets/flowers.png" alt="">
      <img class="flank-lamp" src="assets/lamp.png" alt="">
      <div class="chicken-actor flank-chicken-actor" id="chicken-left"></div>
    </div>

    <!-- Right horizon scenery (outside right sidebar pillar) -->
    <div class="flank flank-right" aria-hidden="true">
      <img class="flank-tree-far-right" src="assets/arvore-meio.png" alt="">
      <img class="flank-tree-right" src="assets/arvore-direita.png" alt="">
      <img class="flank-bush-large-right" src="assets/bush-large.png" alt="">
      <img class="flank-bush-right" src="assets/bush-med.png" alt="">
      <img class="flank-bush-flowers-right" src="assets/bush-flowers.png" alt="">
      <img class="flank-flowers-right" src="assets/flowers.png" alt="">
      <img class="flank-log" src="assets/log.png" alt="">
      <div class="chicken-actor flank-chicken-actor" id="chicken-right"></div>
    </div>

    <header class="development-sign error-sign">
      <img src="assets/development-sign.png" width="168" height="42" alt="">
      <div class="development-sign-copy">
        <h1 id="error-title"><span class="sr-only">404 · </span>Página não encontrada</h1>
        O portal da Íris levou você a um caminho que não existe.
      </div>
      <span class="sign-squirrel" id="sign-squirrel" aria-hidden="true"></span>
    </header>

    <div class="portal-grid">
      <main class="main-col" aria-labelledby="error-title">
        <div class="stone-frame">
          <div class="stage error-stage" aria-hidden="true">
            <div class="stage-bg" aria-hidden="true">
              <div class="stage-mountains"></div>
              <div class="stage-clouds" id="stage-clouds"></div>
              <div class="stage-forest-back"></div>
              <div class="stage-forest-mid"></div>
              <div class="stage-butterflies" id="stage-butterflies"></div>

              <img class="stage-house" src="assets/casa.png" alt="">
              <img class="stage-bush stage-bush-left" src="assets/bush.png" alt="">
              <img class="stage-flowers" src="assets/flowers.png" alt="">
              <img class="stage-bench" src="assets/bench.png" alt="">
              <img class="stage-bush stage-bush-right" src="assets/bush.png" alt="">

              <img class="stage-ground-char error-iris" src="assets/iris.png" alt="" width="33" height="70">
              <div class="stage-ledge stage-ledge-right">
                <img class="stage-sprite sprite-fole" src="assets/fole.png" alt="">
              </div>

              <img class="stage-ground-char sprite-rubi" src="assets/rubi.png" alt="">
              <div class="chicken-actor stage-chicken-actor" id="chicken-stage-1"></div>
              <div class="chicken-actor stage-chicken-actor" id="chicken-stage-2"></div>
              <img class="stage-ground-char sprite-evil" src="assets/evil-gian.png" alt="">
              <div class="stage-floor"></div>
            </div>
            <div class="error-art">
              <span>4</span>
              <span class="portal"><i class="spark"></i><i class="spark"></i><i class="spark"></i></span>
              <span>4</span>
            </div>
          </div>
          <div class="stone-divider" aria-hidden="true"></div>
          <div class="feed">
            <div class="hero-actions error-actions">
              <a class="btn btn-primary" href="/">Voltar ao início</a>
              <a class="btn btn-secondary" href="/play/">Jogar no navegador</a>
            </div>
          </div>
        </div>
      </main>

      <aside class="sidebar" aria-label="Navegação lateral">
        <div class="pillar">
          <div class="pillar-body">
            <nav class="side-nav" aria-label="Menu principal">
              <h2 class="side-heading">Menu</h2>
              <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/#novidades">Novidades</a></li>
                <li><a href="/#sobre">Sobre o Jogo</a></li>
                <li><a href="/termos/">Termos de Serviço</a></li>
                <li><a href="/privacidade/">Política de Privacidade</a></li>
              </ul>

              <h2 class="side-heading">Comunidade</h2>
              <ul>
                <li><a href="https://discord.gg/d4humsHYCa" target="_blank" rel="noopener noreferrer">Discord Oficial</a></li>
              </ul>
            </nav>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <script src="/script.js?v=taiga-squirrel"></script>
</body>
</html>
