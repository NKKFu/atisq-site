<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#55f5ff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://toxwdkuiwrrvkgwlkflg.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Administração · Atisq</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="../style.css?v=x-updates">
  <link rel="stylesheet" href="./admin.css?v=portal">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
  <script defer src="./config.js"></script>
  <script defer src="./admin.js"></script>
</head>
<body class="admin-portal">
  <div class="world" aria-hidden="true">
    <div class="world-sky">
      <div class="world-mountains"></div>
      <div class="world-clouds">
        <img class="portal-cloud cloud-left" src="../assets/cloud-1.png" alt="">
        <img class="portal-cloud cloud-right" src="../assets/cloud-3.png" alt="">
      </div>
      <div class="world-forest-back"></div>
      <div class="world-forest-mid"></div>
    </div>
    <div class="world-horizon"></div>
    <div class="world-soil"></div>
  </div>

  <main class="portal-wrap">
    <div class="flank flank-left" aria-hidden="true">
      <img class="flank-tree-far-left" src="../assets/arvore-meio.png" alt="">
      <img class="flank-tree-left" src="../assets/arvore-esquerda.png" alt="">
      <img class="flank-bush-large-left" src="../assets/bush-large.png" alt="">
      <img class="flank-flowers" src="../assets/flowers.png" alt="">
      <img class="flank-lamp" src="../assets/lamp.png" alt="">
    </div>
    <div class="flank flank-right" aria-hidden="true">
      <img class="flank-tree-far-right" src="../assets/arvore-meio.png" alt="">
      <img class="flank-tree-right" src="../assets/arvore-direita.png" alt="">
      <img class="flank-bush-large-right" src="../assets/bush-large.png" alt="">
      <img class="flank-flowers-right" src="../assets/flowers.png" alt="">
      <img class="flank-log" src="../assets/log.png" alt="">
    </div>

    <div class="development-sign">
      <img src="../assets/development-sign-detailed.png" width="672" height="168" alt="">
      <h1 class="development-sign-copy" id="title">Administração do Atisq</h1>
      <span class="sign-squirrel" aria-hidden="true"></span>
    </div>

    <section class="portal-grid" id="gate" aria-labelledby="title">
      <div class="stone-frame gate-art" aria-hidden="true">
        <div class="stage admin-stage">
          <div class="stage-bg">
            <div class="stage-mountains"></div>
            <div class="stage-clouds">
              <img class="portal-cloud cloud-left" src="../assets/cloud-2.png" alt="">
              <img class="portal-cloud cloud-right" src="../assets/nuvem.png" alt="">
            </div>
            <div class="stage-forest-back"></div>
            <div class="stage-forest-mid"></div>
            <img class="stage-house" src="../assets/casa.png" alt="">
            <img class="stage-bush stage-bush-left" src="../assets/bush.png" alt="">
            <img class="stage-flowers" src="../assets/flowers.png" alt="">
            <img class="stage-bench" src="../assets/bench.png" alt="">
            <img class="stage-bush stage-bush-right" src="../assets/bush.png" alt="">
            <img class="stage-ground-char sprite-rubi" src="../assets/rubi.png" alt="">
            <div class="stage-floor"></div>
          </div>
          <div class="stage-overlay">
            <img class="hero-logo" src="../assets/logo.png" alt="">
          </div>
        </div>
      </div>

      <section class="pillar" aria-labelledby="access-title">
        <div class="pillar-body">
          <h2 class="side-heading" id="access-title">Acesso administrativo</h2>
          <p>Entre com a conta Google autorizada.</p>
          <button class="btn btn-primary" id="sign-in" type="button" disabled>Entrar com Google</button>
          <button class="btn btn-secondary" id="change-account" type="button" hidden>Trocar de conta</button>
          <p class="status" id="auth-status" role="status"></p>
          <noscript><p>Ative o JavaScript para acessar o painel.</p></noscript>
        </div>
      </section>
    </section>

    <section class="portal-grid" id="panel" hidden aria-labelledby="panel-title">
      <div class="stone-frame">
        <div class="panel-heading">
          <h2 id="panel-title" tabindex="-1">Visão geral</h2>
          <dl class="metrics" aria-label="Resumo do jogo">
            <div><dt>Jogadores</dt><dd id="stat-players"></dd></div>
            <div><dt>Clãs</dt><dd id="stat-clans"></dd></div>
            <div><dt>Personagens</dt><dd id="stat-characters"></dd></div>
          </dl>
        </div>
        <div class="stone-divider" aria-hidden="true"></div>

        <section class="listing" aria-labelledby="list-title">
          <h2 id="list-title">Registros do jogo</h2>
          <form class="filters" id="filters">
            <div>
              <label for="section">Categoria</label>
              <select id="section">
                <option value="players">Jogadores</option>
                <option value="clans">Clãs</option>
                <option value="catalogue">Catálogo</option>
              </select>
            </div>
            <div>
              <label for="query">Buscar por nome</label>
              <input id="query" type="search" maxlength="80" autocomplete="off">
            </div>
            <button class="btn btn-primary" type="submit">Buscar</button>
          </form>
          <p class="status" id="list-status" role="status"></p>
          <div class="table-wrap">
            <table id="listing-table" hidden aria-label="Resultados da busca"><thead></thead><tbody></tbody></table>
          </div>
          <div class="pagination" id="pagination" hidden>
            <button class="btn btn-secondary" id="previous" type="button">Anterior</button>
            <span id="page"></span>
            <button class="btn btn-secondary" id="next" type="button">Próxima</button>
          </div>
        </section>
      </div>

      <aside class="sidebar admin-sidebar" aria-label="Administração">
        <section class="pillar" id="account" hidden aria-labelledby="account-title">
          <div class="pillar-body">
            <h2 class="side-heading" id="account-title">Conta Google</h2>
            <p id="email"></p>
            <button class="btn btn-secondary" id="sign-out" type="button">Sair</button>
          </div>
        </section>

        <section class="pillar" aria-labelledby="promo-title">
          <div class="pillar-body">
            <h2 class="side-heading" id="promo-title">Personagens grátis</h2>
            <p id="promo-state"></p>
            <form id="promo-form">
              <label for="promo-date">Término da promoção (hora local)</label>
              <input id="promo-date" type="datetime-local" required>
              <div class="actions">
                <button type="submit" class="btn btn-primary" id="save-promo">Salvar término</button>
                <button type="button" class="btn btn-secondary" id="end-promo">Encerrar agora</button>
              </div>
            </form>
            <p class="status" id="promo-status" role="status"></p>
          </div>
        </section>
      </aside>
    </section>
  </main>
</body>
</html>
