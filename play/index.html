<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d191f">
  <title>Atisq</title>
  <link rel="icon" href="TemplateData/logo.png">
  <link rel="stylesheet" href="TemplateData/game.css">
</head>
<body>
  <main id="unity-container" aria-label="Atisq">
    <div class="stage">
      <canvas id="unity-canvas" tabindex="0" aria-label="Área do jogo" inert></canvas>
      <section id="unity-loading-overlay" aria-label="Carregamento do jogo">
        <div class="error-box" id="error-box" hidden>
          <p id="error-message" role="alert"></p>
          <button id="retry" class="primary" type="button">Tentar de novo</button>
        </div>
        <div id="loading-progress" class="bottom-loader">
          <p class="tip-line">Segure o botão de pulo no ar para voar.</p>
          <div class="progress-track">
            <progress id="unity-progress" max="100" value="0" aria-label="Carregamento"></progress>
            <div class="progress-fill" id="progress-fill" aria-hidden="true"></div>
          </div>
        </div>
      </section>
      <p id="unity-warning" role="status" hidden></p>
      <button id="unity-fullscreen-btn" type="button" title="Tela cheia" aria-label="Tela cheia" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </button>
    </div>
  </main>
  <script src="TemplateData/game.js"></script>
  <script>
    startAtisq("Build/" + "WebGL.loader.js", {
      dataUrl: "Build/" + "WebGL.data.unityweb",
      frameworkUrl: "Build/" + "WebGL.framework.js.unityweb",
      codeUrl: "Build/" + "WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Senom",
      productName: "Atisq",
      productVersion: "v1"
    });
  </script>
</body>
</html>
